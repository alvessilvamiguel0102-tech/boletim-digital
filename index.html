<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 8º Ano</title>
  <!-- Link para o nosso arquivo de estilos -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho principal do site -->
  <header>
    <h1>Boletim Digital</h1>
    <p>8º Ano | Estudante Exemplo</p>
  </header>

  <!-- Conteúdo principal -->
  <main class="container">

    <!-- Área de cards de resumo -->
    <section class="cards-grid">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="media-geral">—</p>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="total-faltas">—</p>
      </div>

      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="qtd-bom-desempenho">—</p>
      </div>

      <div class="card">
        <h3>Precisam de Atenção</h3>
        <p id="qtd-atencao">—</p>
      </div>

      <div class="card">
        <h3>Frequência</h3>
        <p id="frequencia">92%</p>
        <span class="tag-frequencia">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela responsiva de disciplinas -->
    <section class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <!-- O JavaScript vai preencher estas linhas automaticamente -->
        <tbody id="tabela-boletim"></tbody>
      </table>
    </section>

  </main>

  <!-- Link para o nosso código JavaScript -->
  <script src="script.js"></script>
</body>
</html>
